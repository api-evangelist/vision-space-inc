name: Vision Space Inc.
description: >-
  Vision Space Inc. (VisionSpace) is a South Korean company building Physical AI
  robot simulation software for automation in the logistics and manufacturing
  sectors. Its TESSERACT product implements logistics and manufacturing sites as
  digital twins, visualizing process data and predicting operational efficiency
  through AI-based simulation, while its TARS product delivers real-time 3D
  monitoring that integrates and manages data from equipment and robots in a
  unified 3D control dashboard. The company was surfaced as a portfolio company
  of 500 Global and added to the API Evangelist network. As of this enrichment
  pass VisionSpace publishes a marketing website only and exposes no public
  developer API, documentation, developer portal, or GitHub organization.
